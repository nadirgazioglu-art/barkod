{% extends 'base.html' %}
{% block content %}
<div class="grid lg:grid-cols-3 gap-4">
  <form method="post" class="bg-white rounded shadow p-4 space-y-2">
    <h2 class="font-semibold">{{ customer.name }}</h2>
    <input name="name" value="{{ customer.name }}" class="w-full border rounded px-2 py-1" required>
    <input name="contact_name" value="{{ customer.contact_name }}" class="w-full border rounded px-2 py-1">
    <input name="phone" value="{{ customer.phone }}" class="w-full border rounded px-2 py-1">
    <input name="email" value="{{ customer.email }}" class="w-full border rounded px-2 py-1">
    <textarea name="address" class="w-full border rounded px-2 py-1">{{ customer.address }}</textarea>
    <textarea name="note" class="w-full border rounded px-2 py-1">{{ customer.note }}</textarea>
    <button class="bg-slate-900 text-white px-4 py-2 rounded">Güncelle</button>
  </form>
  <section class="lg:col-span-2 bg-white rounded shadow p-4">
    <h3 class="font-semibold mb-2">Etiket Geçmişi</h3>
    <div class="overflow-x-auto">
    <table class="w-full text-xs"><tr class="border-b"><th>Seri</th><th>Dolum</th><th>Sonraki Dolum</th><th>Doğrulatma</th><th>Durum</th><th>İşlem</th></tr>
      {% for l in labels %}
      <tr class="border-b"><td>{{ l.serial_no }}</td><td>{{ l.fill_date }}</td><td>{{ l.next_fill_date }}</td><td>{{ l.verify_count }}</td><td>{{ 'Aktif' if l.is_active else 'Pasif' }}</td>
      <td class="space-x-1">
        <form method="post" action="{{ url_for('toggle_label', label_id=l.id) }}" class="inline"><button class="text-blue-600">Pasif/Aktif</button></form>
        <form method="post" action="{{ url_for('delete_label', label_id=l.id) }}" class="inline" onsubmit="return confirm('Silinsin mi?')"><button class="text-red-600">Sil</button></form>
      </td></tr>
      {% endfor %}
    </table>
    </div>
  </section>
</div>
{% endblock %}
