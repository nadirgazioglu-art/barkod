{% extends 'base.html' %}
{% block content %}
<div class="grid lg:grid-cols-2 gap-4">
  <form method="post" class="bg-white rounded shadow p-4 space-y-2">
    <h2 class="font-semibold">Firma Ayarları</h2>
    <input name="company_name" value="{{ settings.company_name or '' }}" placeholder="Firma adı" class="w-full border rounded px-2 py-1">
    <input name="company_logo_url" value="{{ settings.company_logo_url or '' }}" placeholder="Logo URL" class="w-full border rounded px-2 py-1">
    <textarea name="company_address" placeholder="Adres" class="w-full border rounded px-2 py-1">{{ settings.company_address or '' }}</textarea>
    <input name="company_phone" value="{{ settings.company_phone or '' }}" placeholder="Telefon" class="w-full border rounded px-2 py-1">
    <input name="tse_no" value="{{ settings.tse_no or '' }}" placeholder="TSE belge hizmet no" class="w-full border rounded px-2 py-1">
    <input name="ysc_types" value="{{ settings.ysc_types or '' }}" placeholder="YSC tipleri (virgülle)" class="w-full border rounded px-2 py-1">
    <input type="number" name="dashboard_recent_limit" value="{{ settings.dashboard_recent_limit or 10 }}" class="w-full border rounded px-2 py-1" placeholder="Son doğrulatma adedi">
    <input type="number" name="alert_months" value="{{ settings.alert_months or 3 }}" class="w-full border rounded px-2 py-1" placeholder="Uyarı ayı">
    <button class="bg-slate-900 text-white px-4 py-2 rounded">Kaydet</button>
  </form>

  <section class="bg-white rounded shadow p-4">
    <h2 class="font-semibold">Kullanıcılar</h2>
    <table class="w-full text-sm mb-3"><tr class="border-b"><th>Kullanıcı</th><th>Rol</th><th>İşlem</th></tr>
      {% for u in users %}
      <tr class="border-b"><td>{{ u.username }}</td><td>{{ u.role }}</td>
      <td>
        <form method="post" action="{{ url_for('update_password', user_id=u.id) }}" class="flex gap-1">
          <input type="password" name="password" placeholder="Yeni şifre" class="border rounded px-2 py-1 text-xs">
          <button class="text-blue-700 text-xs">Şifre Değiştir</button>
        </form>
      </td></tr>
      {% endfor %}
    </table>
    {% if g.user.role == 'super' %}
    <form method="post" action="{{ url_for('create_user') }}" class="space-y-2 border-t pt-3">
      <h3 class="font-medium">Yeni Kullanıcı Ekle</h3>
      <input name="username" placeholder="Kullanıcı adı" class="w-full border rounded px-2 py-1" required>
      <input name="password" placeholder="Şifre" class="w-full border rounded px-2 py-1" required>
      <select name="role" class="w-full border rounded px-2 py-1"><option value="normal">Normal</option><option value="super">Süper</option></select>
      <button class="bg-emerald-600 text-white px-4 py-2 rounded">Kullanıcı Ekle</button>
    </form>
    {% endif %}
  </section>
</div>
{% endblock %}
